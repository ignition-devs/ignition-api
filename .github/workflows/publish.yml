name: publish

on:
  release:
    types: [published]

jobs:
  tox:
    uses: ./.github/workflows/tox.yml
    with:
      checkout-ref: ${{ github.event.release.tag_name }}

  pypi-upload:
    needs: tox
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Upload package to PyPI
        uses: coatl-dev/actions/pypi-upload@eaeed3dde61077bd254f6c8b9b523b0a6b182e19 # v7.0.11
        with:
          password: ${{ secrets.PYPI_API_TOKEN_IGNITION_API_PKG }}

      - name: Upload stubs to PyPI
        uses: coatl-dev/actions/pypi-upload@eaeed3dde61077bd254f6c8b9b523b0a6b182e19 # v7.0.11
        with:
          python-version: '3.12'
          password: ${{ secrets.PYPI_API_TOKEN_IGNITION_API_STUBS }}
          working-directory: stubs
