name: publish

on:
  release:
    types: [published]

jobs:
  tox:
    uses: ./.github/workflows/tox.yml
    with:
      checkout-ref: ${{ github.event.release.tag_name }}

  pypi-upload:
    needs: tox
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Upload package to PyPI
        uses: coatl-dev/actions/pypi-upload@a81a1c9a37205e630d28c561dfc3b605b6e031dd # v7.0.5
        with:
          password: ${{ secrets.PYPI_API_TOKEN_IGNITION_API_PKG }}

      - name: Upload stubs to PyPI
        uses: coatl-dev/actions/pypi-upload@a81a1c9a37205e630d28c561dfc3b605b6e031dd # v7.0.5
        with:
          python-version: '3.12'
          password: ${{ secrets.PYPI_API_TOKEN_IGNITION_API_STUBS }}
          working-directory: stubs
