on:
  workflow_call:
    inputs:
      checkout-ref:
        required: true
        type: string

jobs:
  tox-package:
    uses: coatl-dev/workflows/.github/workflows/tox-docker.yml@5cd154b12bb35b3bcd5a84d85fff9f725e5dc3ca # v7.1.1
    with:
      checkout-ref: ${{ inputs.checkout-ref }}

  tox-stubs:
    uses: coatl-dev/workflows/.github/workflows/tox.yml@5cd154b12bb35b3bcd5a84d85fff9f725e5dc3ca # v7.1.1
    with:
      python-versions: |
        3.10
        3.11
        3.12
      working-directory: stubs
      checkout-ref: ${{ inputs.checkout-ref }}
