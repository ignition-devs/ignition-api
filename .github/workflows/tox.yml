on:
  workflow_call:
    inputs:
      checkout-ref:
        required: true
        type: string

jobs:
  tox-package:
    uses: coatl-dev/workflows/.github/workflows/tox-docker.yml@6803f1bf5290b457054db1b58d012c4887b6ada8 # v7.1.1
    with:
      checkout-ref: ${{ inputs.checkout-ref }}

  tox-stubs:
    uses: coatl-dev/workflows/.github/workflows/tox.yml@6803f1bf5290b457054db1b58d012c4887b6ada8 # v7.1.1
    with:
      python-versions: |
        3.10
        3.11
        3.12
      working-directory: stubs
      checkout-ref: ${{ inputs.checkout-ref }}
