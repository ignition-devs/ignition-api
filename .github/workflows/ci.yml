name: ci

on:
  push:
    branches:
      - '8.1'
  pull_request:
    branches:
      - '8.1'

jobs:
  pre-commit:
    uses: coatl-dev/workflows/.github/workflows/pre-commit.yml@6803f1bf5290b457054db1b58d012c4887b6ada8 # v7.1.1
    with:
      checkout-ref: ${{ github.ref }}
      skip-hooks: 'pylint'
      python-version: |
        3.12
        3.15

  pylint:
    uses: coatl-dev/workflows/.github/workflows/pylint.yml@6803f1bf5290b457054db1b58d012c4887b6ada8 # v7.1.1
    with:
      path: src
      checkout-ref: ${{ github.ref }}

  tox:
    if: ${{ github.event_name == 'pull_request' }}
    uses: $/.github/workflows/tox.yml
    with:
      checkout-ref: ${{ github.ref }}
