name: ci

on:
  push:
    branches:
      - '8.3'
  pull_request:
    branches:
      - '8.3'

jobs:
  pre-commit:
    uses: coatl-dev/workflows/.github/workflows/pre-commit.yml@v6
    with:
      checkout-ref: ${{ github.ref }}
      skip-hooks: 'pylint'

  pylint:
    uses: coatl-dev/workflows/.github/workflows/pylint.yml@v6
    with:
      path: src
      checkout-ref: ${{ github.ref }}

  tox:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/tox.yml
    with:
      checkout-ref: ${{ github.ref }}
