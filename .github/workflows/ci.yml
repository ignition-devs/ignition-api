name: ci

on:
  push:
    branches:
      - '2027'
  pull_request:
    branches:
      - '2027'

jobs:
  pre-commit:
    uses: coatl-dev/workflows/.github/workflows/pre-commit.yml@65d1a1eda04de5bb54bd5057b3ebe4b7c8fa4b45 # v7.1.6
    with:
      checkout-ref: ${{ github.ref }}
      skip-hooks: 'pylint'
      python-version: |
        3.12
        3.15

  pylint:
    uses: coatl-dev/workflows/.github/workflows/pylint.yml@65d1a1eda04de5bb54bd5057b3ebe4b7c8fa4b45 # v7.1.6
    with:
      path: src
      checkout-ref: ${{ github.ref }}

  tox:
    if: ${{ github.event_name == 'pull_request' }}
    uses: $/.github/workflows/tox.yml
    with:
      checkout-ref: ${{ github.ref }}
